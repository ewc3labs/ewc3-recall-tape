name: Release

# Deliberately unsophisticated, because RecallTape is pre-alpha.
#
# No semver bumping, no changelog generation, no signing, no MSI. Tag it, push the tag, get a zip on a
# GitHub Release. Those things are worth adding when people are installing this; adding them now would
# be machinery maintained for an audience of two.
#
# What this is NOT yet, and what the README promises for public release:
#   - a signed installer (SmartScreen will warn on an unsigned one - see docs/RAG_Sessions/)
#   - an MSI that registers the add-in for the user
# Until then the zip carries an install script the user runs as administrator.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish as (e.g. v0.0.1). Leave blank for a draft named after the run.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
          # 8.0 is the BUILD DRIVER only. Both projects target net48, which is what ships on every
          # Windows 10/11 machine - a student installing a study tool should not install a runtime
          # first. Do not "fix" this to net8.0.

      - name: Build add-in
        run: dotnet build src/RecallTape.OneNote/RecallTape.OneNote.csproj -c Release

      - name: Build protocol handler
        run: dotnet build src/RecallTape.ProtocolHandler/RecallTape.ProtocolHandler.csproj -c Release

      - name: Stage the package
        shell: pwsh
        run: |
          $stage = "stage/RecallTape"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          # The add-in and everything it needs beside it. Extensibility is embedded at compile time
          # (EmbedInteropTypes), so it is deliberately absent here - there is nothing to ship.
          Copy-Item "src/RecallTape.OneNote/bin/Release/net48/RecallTape.OneNote.dll" $stage
          Copy-Item "src/RecallTape.OneNote/bin/Release/net48/Microsoft.Office.Interop.OneNote.dll" $stage
          Copy-Item "src/RecallTape.ProtocolHandler/bin/Release/net48/RecallTape.ProtocolHandler.exe" $stage

          Copy-Item "tools/install.ps1"   $stage
          Copy-Item "tools/uninstall.ps1" $stage
          # The double-clickable wrappers are the supported path: a .ps1 has no "Run as
          # administrator" on its context menu, and scripts out of a downloaded zip are blocked.
          Copy-Item "tools/Install RecallTape.cmd"   $stage
          Copy-Item "tools/Uninstall RecallTape.cmd" $stage
          Copy-Item "LICENSE"             $stage
          Copy-Item "CHANGELOG.md"        $stage

          # Fail loudly if a file we expect is missing, rather than shipping a zip that cannot install.
          $required = @(
            'RecallTape.OneNote.dll',
            'Microsoft.Office.Interop.OneNote.dll',
            'RecallTape.ProtocolHandler.exe',
            'install.ps1',
            'Install RecallTape.cmd'
          )
          foreach ($f in $required) {
            if (-not (Test-Path (Join-Path $stage $f))) { throw "Package is missing $f" }
          }

          Get-ChildItem $stage | Format-Table Name, Length

      - name: Zip
        shell: pwsh
        run: |
          $tag = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' }
                 elseif ('${{ inputs.tag }}') { '${{ inputs.tag }}' }
                 else { "run-${{ github.run_number }}" }
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # STABLE filename, deliberately - no version in it.
          #
          # https://github.com/<owner>/<repo>/releases/latest/download/<exact-filename> always serves
          # the newest release's asset with that name. That only works if the name never changes, and
          # it turns the download into one permanent link we can put in the README - no clicking
          # through the releases page, no expanding GitHub's collapsed Assets section, no stale links
          # when a new version ships. The version lives in the release title and in the CHANGELOG
          # inside the zip.
          #
          # "-install" because GitHub attaches "Source code (zip)" and "(tar.gz)" to every release
          # automatically, and those are the downloads that look most official. Paul downloaded one.
          Compress-Archive -Path "stage/RecallTape/*" -DestinationPath "RecallTape-install.zip"

      - name: Checksum
        shell: pwsh
        run: |
          $h = Get-FileHash "RecallTape-install.zip" -Algorithm SHA256
          "$($h.Hash)  RecallTape-install.zip" | Out-File "RecallTape-install.zip.sha256" -Encoding ascii
          Get-Content "RecallTape-install.zip.sha256"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: RecallTape ${{ env.TAG }}
          # DRAFT stays on deliberately: nothing becomes public until a human looks at it. Cheap
          # insurance while the install story is still a script and RT-14 is open. Publishing is one
          # command - `gh release edit <tag> --draft=false`.
          #
          # prerelease is deliberately OFF, and it is a real trade. GitHub's /releases/latest resolves
          # to the newest non-draft NON-PRERELEASE release, so flagging it as a prerelease would break
          # the permanent download link the README depends on. "Alpha" is still stated in the release
          # title, the first line of the body, the README status section and its badge - four signals.
          # The flag was the only one that broke a download.
          draft: true
          # Both, not either. GitHub PRE-PENDS `body` to the notes it generates, so the hand-written
          # install instructions stay at the top where a first-time visitor needs them, and the
          # "What's Changed" commit list lands underneath for anyone who cares what moved.
          generate_release_notes: true
          files: |
            RecallTape-install.zip
            RecallTape-install.zip.sha256
          body: |
            **Alpha.** Taping and peeking work on real notes. Things will break — please open an issue when they do.

            ## Install

            ### ⬇ [Download RecallTape ${{ env.TAG }}](https://github.com/ewc3labs/ewc3-recall-tape/releases/latest/download/RecallTape-install.zip)

            That link downloads the program directly. If you would rather pick it from the list below,
            the file is **`RecallTape-install.zip`** — *not* "Source code (zip)", which GitHub adds to
            every release automatically and contains no program.

            1. **Extract it somewhere permanent** (`C:\Tools\RecallTape` is fine). RecallTape runs from
               where you extract it, so don't unzip into Downloads and then tidy up.
            2. Double-click **`Install RecallTape.cmd`** and say yes to the admin prompt. It handles
               elevation and unblocking for you — you do not need to know anything about PowerShell.
            3. Restart OneNote. Look for the **RecallTape** tab.

            Administrator is needed once, to register the add-in with Windows.

            > **Windows will warn you.** This isn't code-signed yet, so SmartScreen flags it as
            > unrecognised — *More info* → *Run anyway*. That's a real gap, not a formality.

            **What changed:** see [CHANGELOG.md](https://github.com/ewc3labs/ewc3-recall-tape/blob/main/CHANGELOG.md)
            for the readable version — the auto-generated commit list below is accurate but terse.

            ## Use it

            - Select text, ink, or an image → **Tape**
            - Press **Tape** with *nothing* selected to drop a free box you can drag and resize onto
              anything — including page backgrounds and lecture printouts, which OneNote will not let
              you select
            - **Ctrl+click** a tape strip to peek under it; click again to cover it back up. A peeked
              tape keeps a grey outline so you can find it again
            - Selecting over taped text also reveals it
            - **Remove Tape** clears the one you have selected; **Remove All** clears the page, and asks first

            ## Uninstall

            Double-click **`Uninstall RecallTape.cmd`** — it removes every registry key and leaves
            nothing behind. Your notes are untouched, but tape already on a page stays there as
            ordinary content, so use **Remove All Tape** first on anything you want cleared.

            ## Requirements

            - Windows, OneNote **desktop** (the Office one, not the Store app)
            - .NET Framework 4.8 — already on every Windows 10/11 machine
            - Runs native on ARM64 (Snapdragon Surfaces) as well as x64
